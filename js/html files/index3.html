<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #2a2a33;  color: #fff;">
    
</body>
<script>
    
    function createAndAppendDiv(color) {
        

    let div = document.createElement('div');
    console.log(div);;
    div.className = 'main';
    div.id = Math.round(Math.random()*10 +1 );  //to generrate random ID
    div.setAttribute('title', 'Generated title');
    div.style.backgroundColor = color;  //#D2B48C
    div.style.padding = "12px";
    //div.innerText = "This is a new div element";
    let addText = document.createTextNode('This is a new div element');
    div.appendChild(addText);
    
    // this and above line are same thing.
    //all this wont make diff on the page. It will be in the memory.
    //to show it on the page, we need to append it to the body.
    document.body.appendChild(div);
    let br = document.createElement('br');
    document.body.appendChild(br);

    }

    createAndAppendDiv('#D2B48C');
    createAndAppendDiv('#d3d3d3');
    createAndAppendDiv('#D2B48C');  
    createAndAppendDiv('#d3d3d3');

</script>
</html>
