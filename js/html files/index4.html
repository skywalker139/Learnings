<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM again</title>
</head>
<body style="background-color: #2a2a33;  color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    
    //Add

    function addLanguage(langName){
        const li = document.createElement('li');
        li.iinerHTML = `${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('Python');
    addLanguage('typescript');

    function addOptiLanguage(language){                 //optimized way to add language, pura html tree traverse nahi karna padega
        const li = document.createElement('li');        // large scale implementation me isse performance me improvement aayegi
        li.appendChild(document.createTextNode(language));
        document.querySelector('.language').appendChild(li);0
    }
    addOptiLanguage('golang');

    //Edit
    const secondLang = document.querySelector('li : nth-child(2)');
    // secondLang.innerHTML = 'Mojo';
    const newli = document.createElement('li');
    newli.innerText = 'Mojo';
    secondLang.replaceWith(newli);
     
    //edit
    const firstLang = document.querySelector('li:first-child');
    firstLang.outerHTML = '<li>Ruby</li>';

    //delete
    const lastLang = document.querySelector('li:last-child');
    lastLang.remove();

</script>
</html>
